---
layout: default
---
<article>
  <div class="post-header">
    <p class="eyebrow">
      {% for tag in page.tags %}{{ tag }}{% unless forloop.last %} · {% endunless %}{% endfor %}
    </p>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  </div>
  <div class="post-body">
    {{ content }}
  </div>
</article>
